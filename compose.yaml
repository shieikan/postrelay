services:
  postrelay:
    build: .
    restart: unless-stopped
    stop_grace_period: 20s
    command: ["python", "-m", "postrelay", "--host", "0.0.0.0", "--mode", "selfhost", "--live", "--relay-web-push", "--push-port", "8767", "--data-dir", "/data"]
    ports:
      - "127.0.0.1:${POSTRELAY_PORT:-8765}:8765"
    # Avoid inheriting long DHCP/VPN DNS search domains (glibc CVE-2026-8674).
    dns_search: ["."]
    environment:
      POSTRELAY_PUBLIC_URL: "${POSTRELAY_PUBLIC_URL:-http://localhost:8765}"
      POSTRELAY_SIGNUP_KEY: "${POSTRELAY_SIGNUP_KEY:?Set a random registration key with at least 20 characters}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from urllib.request import Request,urlopen; from urllib.parse import urlsplit; urlopen(Request('http://127.0.0.1:8765/api/bootstrap',headers={'Host':urlsplit(os.environ['POSTRELAY_PUBLIC_URL']).netloc}),timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postrelay-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  angelic:
    profiles: ["x"]
    build:
      context: .
      dockerfile: integrations/angelic/Dockerfile
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      postrelay:
        condition: service_healthy
        restart: true
    # The source can reach the private listener; no push port is published.
    network_mode: "service:postrelay"
    volumes:
      - angelic-data:/private
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  postrelay-data:
  angelic-data:
