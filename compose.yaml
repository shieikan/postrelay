services:
  postrelay:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      POSTRELAY_PUBLIC_URL: http://127.0.0.1:8765
      POSTRELAY_SIGNUP_KEY: "${POSTRELAY_SIGNUP_KEY:?Set a random registration key with at least 20 characters}"
    volumes:
      - postrelay-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  postrelay-data:
