name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s tests -v
      - run: node --test tests/*.test.cjs
      - run: node --check web/app.js && node --check web/notification-settings.js
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: ruff check --select F postrelay scripts integrations/angelic tests
      - run: bandit -r postrelay scripts integrations/angelic -ll
      - name: Check the development analysis-tool dependencies
        run: pip-audit --strict -r requirements-dev.txt
      - run: python scripts/get-security-tools.py --directory "$RUNNER_TEMP/scanners"
      - run: "$RUNNER_TEMP/scanners/gitleaks git --redact --no-banner --config .gitleaks.toml"
      - name: Check the shipped Rust dependency lock
        run: >-
          "$RUNNER_TEMP/scanners/trivy" fs --scanners vuln
          --exit-code 1 integrations/angelic
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --yes nginx
      - run: python3 -B -m scripts.proxy-smoke
  containers:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build Linux amd64 application
        id: application
        env:
          POSTRELAY_SIGNUP_KEY: synthetic-ci-registration-key
        run: docker compose -p postrelay build --pull postrelay
      - name: Verify actual application components and preserve inventory
        run: python scripts/runtime-evidence.py "$RUNNER_TEMP/image-reports" postrelay
      - name: Test application in an isolated Linux container
        run: >-
          docker run --rm --network none
          --mount type=bind,source=${{ github.workspace }}/tests,target=/app/tests,readonly
          --mount type=bind,source=${{ github.workspace }}/scripts,target=/app/scripts,readonly
          postrelay-postrelay python -B -m unittest discover -s tests -v
      - name: Build fixed X receiver in the release profile
        id: images
        env:
          POSTRELAY_SIGNUP_KEY: synthetic-ci-registration-key
        run: docker compose -p postrelay --profile x build --pull angelic
      - name: Verify actual receiver components and preserve inventory
        run: python scripts/runtime-evidence.py "$RUNNER_TEMP/image-reports" angelic
      - name: Check fresh setup, persistence and private ingress
        env:
          POSTRELAY_SIGNUP_KEY: synthetic-ci-registration-key
        run: python scripts/compose-smoke.py
      - name: Check source CLI without credentials or network
        run: |
          docker run --rm --network none postrelay-angelic help
          docker run --rm --network none --entrypoint /usr/local/bin/angelic-angel postrelay-angelic --help
      - name: Install scanner
        if: always() && steps.images.outcome == 'success'
        run: python scripts/get-security-tools.py --only trivy --directory "$RUNNER_TEMP/scanners"
      - name: Scan both actual runtime images without suppressing findings
        if: always() && steps.images.outcome == 'success'
        id: image_scan
        run: |
          mkdir -p "$RUNNER_TEMP/image-reports"
          "$RUNNER_TEMP/scanners/trivy" image --scanners vuln --format json --output "$RUNNER_TEMP/image-reports/postrelay.json" postrelay-postrelay
          "$RUNNER_TEMP/scanners/trivy" image --scanners vuln --format json --output "$RUNNER_TEMP/image-reports/angelic.json" postrelay-angelic
          docker image inspect postrelay-postrelay postrelay-angelic > "$RUNNER_TEMP/image-reports/image-identities.json"
          "$RUNNER_TEMP/scanners/trivy" image --format cyclonedx --output "$RUNNER_TEMP/image-reports/postrelay-sbom.json" postrelay-postrelay
          "$RUNNER_TEMP/scanners/trivy" image --format cyclonedx --output "$RUNNER_TEMP/image-reports/angelic-sbom.json" postrelay-angelic
      - name: Save synthetic runtime scan results
        if: always() && steps.image_scan.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-image-scans
          path: ${{ runner.temp }}/image-reports
          retention-days: 14
          if-no-files-found: error
      - name: Enforce the application High/Critical image gate
        if: always() && steps.image_scan.outcome == 'success'
        run: >-
          "$RUNNER_TEMP/scanners/trivy" image --scanners vuln
          --severity HIGH,CRITICAL --exit-code 1 postrelay-postrelay
      - name: Enforce the receiver High/Critical image gate
        if: always() && steps.image_scan.outcome == 'success'
        run: >-
          "$RUNNER_TEMP/scanners/trivy" image --scanners vuln
          --severity HIGH,CRITICAL --exit-code 1 postrelay-angelic
