# Standalone HTTPS example for nginx on the same Linux host as Compose.
# Replace notify.example.com and certificate paths; see docs/server.md.
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/null; # nginx error logs can also include secret-bearing request paths.
events { worker_connections 128; }
http {
    access_log off; # Source tokens live in URLs; never retain them in request logs.
    server_tokens off;
    limit_conn_zone $server_name zone=postrelay_total:1m;
    limit_conn_zone $binary_remote_addr zone=postrelay_client:1m;
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s; # Idle between reads, NOT an absolute upload deadline.
    send_timeout 10s;
    keepalive_timeout 5s;
    keepalive_requests 20;
    reset_timedout_connection on;
    server {
        listen 443 ssl default_server;
        server_name notify.example.com;
        ssl_certificate /etc/letsencrypt/live/notify.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/notify.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        if ($host != notify.example.com) { return 421; }
        limit_conn postrelay_total 32;
        limit_conn postrelay_client 8;
        limit_conn_status 503;
        # Raw X payloads must never be exposed through the public proxy.
        location ^~ /api/push/ { return 404; }
        location / {
            proxy_pass http://127.0.0.1:8765;
            proxy_set_header Host $http_host;
            proxy_set_header Connection close;
            proxy_http_version 1.0;
            proxy_request_buffering on;
            proxy_buffering on;
            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 15s;
        }
    }
}
